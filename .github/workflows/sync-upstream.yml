name: Sync Upstream

on:
  schedule:
    # 每天每 6 小时自动检测一次 (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动一键触发

jobs:
  sync:
    name: Sync Upstream Changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote and Fetch
        run: |
          git remote add upstream https://github.com/zhaoxuya520/reverse-skill.git || true
          git fetch upstream main

      - name: Check for Upstream Updates
        id: check_sync
        run: |
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $BEHIND_COUNT"
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "count=$BEHIND_COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge Upstream Changes
        if: steps.check_sync.outputs.has_updates == 'true'
        run: |
          echo "Syncing ${{ steps.check_sync.outputs.count }} commit(s) from upstream..."
          git merge upstream/main --no-edit -m "chore(sync): sync ${{ steps.check_sync.outputs.count }} commit(s) from upstream (zhaoxuya520/reverse-skill)" || {
            echo "Conflict detected! Merging with upstream strategy..."
            git merge --abort || true
            git merge -X theirs upstream/main --no-edit -m "chore(sync): merge upstream changes with conflict resolution"
          }
      
          # 自动版本更新（保持原样）
          if [ -f "VERSION" ]; then
            NEW_VERSION=$(cat VERSION | tr -d '[:space:]')
            if [ -n "$NEW_VERSION" ]; then
              echo "Checking plugin version against VERSION ($NEW_VERSION)..."
              if [ -f ".claude-plugin/plugin.json" ]; then
                jq --arg v "$NEW_VERSION" '.version = $v' .claude-plugin/plugin.json > .claude-plugin/plugin.json.tmp && mv .claude-plugin/plugin.json.tmp .claude-plugin/plugin.json
              fi
              if [ -f ".claude-plugin/marketplace.json" ]; then
                jq --arg v "$NEW_VERSION" '.plugins[0].version = $v' .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.tmp && mv .claude-plugin/marketplace.json.tmp .claude-plugin/marketplace.json
              fi
              if ! git diff --quiet .claude-plugin/; then
                echo "Plugin version changed, committing version bump..."
                git add .claude-plugin/
                git commit -m "chore(plugin): sync plugin version to $NEW_VERSION"
              fi
            fi
          fi
      
          # ✅ 检查 PAT_TOKEN 是否存在
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "ERROR: PAT_TOKEN secret is not set or empty!"
            exit 1
          fi
      
          # ✅ 打印当前 remote（辅助调试）
          echo "Current remote URL:"
          git remote -v
      
          # ✅ 关键：使用 PAT 直接推送，不依赖 remote
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }} main
      
          echo "Sync completed successfully."

      - name: Up to Date
        if: steps.check_sync.outputs.has_updates == 'false'
        run: |
          echo "Repository is already up to date with upstream."
